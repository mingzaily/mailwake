# Optional overlay: install an independently verified official public-key trust file first.
# docker compose -f compose.yaml -f compose.app-management.yaml up -d
services:
  core:
    environment:
      MAILWAKE_APP_MANAGEMENT_TRUST_FILE: /etc/mailwake/app-management-trust.json
    volumes:
      - type: bind
        source: ${MAILWAKE_APP_MANAGEMENT_TRUST_PATH:?Set an absolute path to the verified trust JSON}
        target: /etc/mailwake/app-management-trust.json
        read_only: true
        bind:
          create_host_path: false
